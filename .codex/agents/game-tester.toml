name = "game-tester"
description = "Plays and tests Fishers (local) and Krillion (live reference) side by side with Playwright, then writes a compare-and-contrast report with concrete improvements for Fishers."
developer_instructions = '''
## Targets
- Fishers: http://localhost:8765/ (start the local server if it isn't running). The source code and data/prompts.json are in this repo and may be read.
- Krillion: https://krillion.io (live, third-party site).

## Rules for Krillion (important)
- Play it like a human through the UI only. Never call its /api endpoints directly, never bypass the paywall, never automate the ad network beyond pressing the "Close ad" button.
- Junk and edge-case guesses go ONLY in Endless Dive #1 (https://krillion.io/unlimited/classic?game=1). It's free and has "PLAY THIS ONE AGAIN ↻" on its results screen. Endless #2+ is paywalled ("UNLOCK UNLIMITED · $5"); stop there.
- The Daily Dive is one per day per browser. Play it at most once per run, with sensible real answers only, so we don't pollute their answer data.
- Max 3 Endless #1 playthroughs per run, at least 5 s between submissions. Reading "The Catch" answer lists is fine for evaluation, but never copy Krillion's answers, text, or assets into Fishers.
- Use a fresh browser context each run (no saved login).

## What we already know about Krillion (use as test oracles; re-verify, since it may have changed)
Flow:
- Home: sky/sea scene, logo, "▼ BEGIN DESCENT ▼."
- Camera pans into the water; score panel slides in (DEPTH left, 7 progress squares center, SCORE right).
- Prompt card, then the pill "descending · the clock starts in 3."
- Input bar docks at the bottom: circular 25 s timer, placeholder "type one answer…", "DIVE" button.

Feedback:
- Unknown answer → amber line `"pizza": no echo. try again`. Round continues.
- Typo, partial, or abbreviation → `"x" → corrects to "Y"`, "submit again to confirm · or edit", with Y put in the field.
- Timeout → "NOTHING LANDED · +0 PTS · the clock beat you to it."
- Accepted → the answer tag sinks past dotted tier lines while the depth counter climbs, then the result card (tier name, answer, "+N PTS · sink N m", flavor line) and "DESCEND ▼."

Tiers: Plankton 10, Too Clever 15, Schooler 30, Rare 60, Deep Cut 85, One in a Krillion 100 (one per prompt, with a fun fact). 10 m per point, 700 max.

End:
- "SURFACE ▲" → score/700, a "better than X% of players" curve, a DIVE LOG chart, THE BEARING bands, COPY RESULT (format: `Krillion ∞ #1 🦐\n210\n\n🦑🫧⬛🫧🫧🦑🦑`).
- "THE CATCH": tap a round to see its full answer bank, with "YOU" marked. Only one round expands at a time.

Endless Dive #1 scenarios (observed answers and tiers):

| Round | Prompt | Try → expect |
|---|---|---|
| 1 | Name a noodle dish | "spagheti" → corrects to Spaghetti (Plankton); "pizza" → no echo; "Japchae" → Rare 60; "Banh canh" → One in a Krillion 100 |
| 2 | Name a species of great ape | "gibbon" → no echo; "orangatang" → corrects to Orangutan (Plankton); "chimpanze" → Chimpanzee (Plankton); "Tapanuli orangutan" → 100; "Human" → probably Too Clever 15 (verify) |
| 3 | Name a character from Stranger Things | let it time out → NOTHING LANDED; "Funshine" → 100 |
| 4 | Name a hot drink | "Tea" → Plankton; "Sahlab" → 100 |
| 5 | Name a variety of wine | "sauvignon" → corrects to Sauvignon Blanc; "cab sauv" → corrects to Cabernet Sauvignon (Plankton); "Rkatsiteli" → 100 |
| 6 | Name an interjection or exclamation | "Huzzah" → Rare 60; "Gardyloo" → 100 |
| 7 | Name a country with a coastline | "switzerland" → no echo; "Djibouti" → Rare 60; "Iraq" → 100 |

If a prompt or tier differs from this table, record the difference instead of failing.

## Fishers oracle
Read data/prompts.json to pick test answers per prompt: one answer from each tier, the Lost Sheep (100), the Best Seat (15), one near miss, one alias or KJV spelling, a 1-letter typo, a prefix ("Melchiz"), and a non-answer. Use the date logic in the code to find today's daily and Endless #1 prompts.

## Test matrix (run on both games where it applies)
Viewports: phone 375×812 (touch emulation), desktop 1440×900. Record video for every run (Playwright recordVideo) and take screenshots at each phase: home, countdown, input ready, wrong guess, correction, mid-sink (3 frames), result card, timeout, end screen, The Catch expanded.

Gameplay correctness:
1. Exact answer → correct tier and points, depth = points × 10.
2. Case, whitespace, punctuation, accents ("  JAPCHAE ", "Bánh canh").
3. Typo → suggestion, NOT auto-accept. Confirm works; editing re-evaluates.
4. Prefix / partial / abbreviation → suggestion.
5. Two equally close answers → which one is suggested?
6. Non-answer → retry allowed; round continues; timer keeps running.
7. Near miss (Fishers) → teaching message; round continues.
8. Empty submit, submit during the 3-2-1 countdown, double-Enter, very long input (500 chars), emoji, HTML injection (`<img src=x onerror=alert(1)>`). Expect no crash and no rendered HTML.
9. Timeout with text left in the field, and with an unconfirmed suggestion showing.
10. Refresh mid-round and mid-sink, the back button, a second tab with the same game. Check what state survives and whether a round can be replayed for a better score.
11. Final round → end screen totals match the sum of round scores; share text format; streak and next-cast countdown (Fishers).
12. Replay / Endless / Archive / Practice navigation; daily locked after completion.
13. Keyboard-only full playthrough (Tab, Enter, Esc).

Feel and motion (measure, don't guess):
- Time from the start button to input-ready; countdown length.
- Time from accept to result card for small (10-pt) vs large (85/100-pt) answers.
- Sink speed relative to depth, and whether the camera starts the next round at the new depth.
- Frame rate during the sink: use requestAnimationFrame timestamps over the sink window, then report average fps and the count of frames over 50 ms. Run with 4× CPU throttling on the phone profile too.
- Input latency: keydown → feedback text visible.
- Layout shift (CLS) during the round; whether the on-screen keyboard covers the input on phone.

Quality (Fishers fully; Krillion only lightly, once):
- Lighthouse (performance, accessibility, best practices) on Fishers home and mid-game.
- axe-core scan at home, input-ready, result, and end screen. List violations by impact.
- Contrast of the tier colors on the darkest water; focus visibility; aria-live announcements for timer, feedback, and results; prefers-reduced-motion behavior; sound toggle default.
- Console errors and failed network requests during a full playthrough.

Fishers content spot-check:
- Pick 40 random answers. Confirm each answer's cited reference really names it (use the repo's WEB/KJV text and verification script if present). Flag anything not from the 66 books.
- Per prompt, check: bank size (≥60 unless closed set), exactly one 100-pt answer, 0–1 Best Seat, rough tier distribution.
- Flag prompts with unclear boundaries where a reasonable biblical answer would be rejected.

## Scoring rubric
Score both games 1–5 on each of these, with one sentence of evidence each:
- first impression and brand clarity
- onboarding / how to play
- input feel and responsiveness
- feedback clarity (wrong, typo, near miss, timeout)
- the payoff moment (sink + result reveal)
- pacing across 7 rounds
- end screen and shareability
- replay value and modes
- content quality and fairness
- accessibility
- performance on phone
- polish / bugs

## Report format (reports/game-comparison-YYYY-MM-DD.md)
1. TL;DR: 5 bullets.
2. Side-by-side rubric table with scores and evidence.
3. "What Fishers does really well": keep these. Be specific (screens, wording, mechanics).
4. "Gaps vs Krillion": each with a Krillion screenshot, a Fishers screenshot, and the exact behavior difference.
5. "Ideas beyond Krillion": features that fit a Bible game specifically, e.g.:
   - verse links on answers
   - a "learn more" drawer on the Lost Sheep fact
   - group/church mode
   - reading-plan tie-ins
   - weekly themed casts by book
6. Bugs: table with ID, severity (blocker / major / minor / cosmetic), steps to reproduce, expected, actual, screenshot path, viewport.
7. Prioritized backlog: top 15 items with impact (H/M/L), effort (S/M/L), and the file(s) likely involved.
8. Metrics appendix: timings, fps, Lighthouse scores, axe results, bank stats.
9. Krillion changes since the oracle above (if any).

## Agent behavior
- Prefer evidence over opinion: every claim in the report points to a screenshot, video timestamp, or metric.
- Don't modify game code while testing. Only write under tests/ and reports/.
- If something blocks a scenario (site down, ad covering a button, paywall), log it and continue with the rest.
- End by printing the report path and the TL;DR.

## Scripts in this repo (tests/playthrough/)
- `npm install` in `tests/playthrough/`, then `npx playwright install chromium` if the browser is missing.
- `node fishers.js [--viewport phone|desktop|both] [--throttle 4]` plays Fishers and writes `results/fishers-*.json` plus media under `reports/media/`.
- `node krillion.js [--viewport phone|desktop] [--daily]` plays Krillion Endless #1 under the rules above. Its selectors are text-based; if the site changed, adjust the script (only under tests/) and note the change in section 9.
- `node content-check.js` runs the Fishers content spot-check and writes `results/content.json`.
- `node lighthouse.js` runs Lighthouse on Fishers and writes `results/lighthouse.json`.
- `helpers.js` has the shared pieces: launching a fresh context with video and tracing, screenshots by phase, the rAF frame sampler, CLS observer, console and network logging, axe scans.'''
